<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تنزيلات طرطوس - ألبسة ومشتقاتها</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');

    :root {
      --bg-main: #121212;
      --bg-card: #1a1a1a;
      --bg-input: #09090b;
      --border-color: #27272a;
      --text-main: #f4f4f5;
      --text-muted: #9ca3af;
      --accent: #ea580c;
      --accent-hover: #c2410c;
      --sale-badge: #991b1b;
      --success: #16a34a;
      --danger: #dc2626;
    }

    body.light-mode {
      --bg-main: #f4f4f5;
      --bg-card: #ffffff;
      --bg-input: #f8fafc;
      --border-color: #d4d4d8;
      --text-main: #18181b;
      --text-muted: #52525b;
    }

    * {
      box-sizing: border-box;
      font-family: 'Cairo', sans-serif;
    }

    body {
      margin: 0;
      background-color: var(--bg-main);
      color: var(--text-main);
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 16px;
    }

    header {
      background-color: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      padding: 14px 16px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .header-inner {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.2rem;
      color: var(--accent);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    button, input, select, textarea {
      font-family: 'Cairo', sans-serif;
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 9px 14px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.9rem;
      transition: 0.2s ease;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-outline {
      background: transparent;
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }

    .btn-danger {
      background: var(--danger);
      color: #fff;
      padding: 6px 10px;
      font-size: 0.8rem;
    }

    .panel {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 18px;
      margin-top: 18px;
    }

    .hidden {
      display: none !important;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }

    .checkbox-row {
      flex-direction: row;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
    }

    .checkbox-row input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    label {
      font-weight: 700;
      font-size: 0.9rem;
    }

    input[type="text"],
    input[type="number"],
    select,
    textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: var(--bg-input);
      color: var(--text-main);
      font-size: 0.95rem;
    }

    .upload-box {
      border: 1.5px dashed var(--accent);
      background: var(--bg-input);
      border-radius: 12px;
      padding: 12px;
    }

    .upload-hint {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 6px;
    }

    .preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
      gap: 10px;
      margin-top: 12px;
    }

    .preview-item {
      position: relative;
      aspect-ratio: 1 / 1;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      background: #000;
    }

    .preview-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .remove-img-btn {
      position: absolute;
      top: 4px;
      left: 4px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: none;
      background: rgba(220, 38, 38, 0.92);
      color: #fff;
      font-weight: 800;
      cursor: pointer;
      line-height: 1;
    }

    .img-badge {
      position: absolute;
      bottom: 4px;
      right: 4px;
      background: rgba(0, 0, 0, 0.72);
      color: #fff;
      font-size: 0.7rem;
      padding: 1px 6px;
      border-radius: 6px;
    }

    .filters-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
      align-items: center;
    }

    .filters-bar input {
      flex: 1;
      min-width: 220px;
    }

    /* شبكة عرض عمودين متناسقة مع واجهة المتجر */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px 14px;
      margin-top: 18px;
    }

    @media (min-width: 768px) {
      .products-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .product-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .media-box {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1.05;
      background: var(--bg-input);
      overflow: hidden;
    }

    .media-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .sale-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(153, 27, 27, 0.92);
      color: #ffffff;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 8px;
      z-index: 2;
    }

    .photos-counter {
      position: absolute;
      bottom: 8px;
      left: 8px;
      background: rgba(0, 0, 0, 0.72);
      color: #fff;
      font-size: 0.74rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      z-index: 2;
    }

    .gallery-nav {
      position: absolute;
      inset-inline: 6px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      z-index: 2;
    }

    .gallery-nav button {
      pointer-events: auto;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: none;
      background: rgba(0, 0, 0, 0.62);
      color: #fff;
      font-weight: 800;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .product-body {
      padding: 10px 12px;
    }

    .store-tag {
      font-size: 0.76rem;
      color: var(--accent);
      font-weight: 700;
    }

    .product-title {
      margin: 3px 0 4px;
      font-size: 0.92rem;
      font-weight: 800;
      line-height: 1.35;
    }

    .product-desc {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin: 0 0 8px;
      white-space: pre-line;
    }

    .price-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .current-price {
      font-weight: 800;
      color: var(--accent);
      font-size: 0.9rem;
    }

    .old-price {
      font-size: 0.78rem;
      color: var(--text-muted);
      text-decoration: line-through;
    }

    .card-actions {
      display: flex;
      gap: 6px;
      padding: 0 12px 12px;
      align-items: center;
    }

    .whatsapp-btn {
      flex: 1;
      text-align: center;
      text-decoration: none;
      background: var(--success);
      color: #fff;
      padding: 7px 8px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.8rem;
    }

    .empty-state {
      text-align: center;
      padding: 36px 16px;
      color: var(--text-muted);
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      margin-top: 18px;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand">
        <span>🛍️ تنزيلات طرطوس</span>
      </div>
      <div class="header-actions">
        <button type="button" class="btn btn-outline" id="themeToggleBtn">🌙 / ☀️</button>
        <button type="button" class="btn btn-primary" id="toggleMerchantBtn">بوابة التجار</button>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- بوابة إضافة العروض -->
    <section class="panel hidden" id="merchantPanel">
      <h2 style="margin-top: 0;">إضافة عرض جديد</h2>

      <form id="productForm">
        <div class="form-grid">
          <div class="form-group">
            <label for="storeName">المحل</label>
            <input type="text" id="storeName" placeholder="مثال: محلات جيفان / باليرينا" required />
          </div>

          <div class="form-group">
            <label for="productTitle">اسم القطعة أو العرض</label>
            <input type="text" id="productTitle" placeholder="مثال: جاكيت شتوي فاخر" required />
          </div>

          <div class="form-group">
            <label for="categorySelect">القسم</label>
            <select id="categorySelect">
              <option value="ألبسة رجالية">ألبسة رجالية</option>
              <option value="ألبسة نسائية">ألبسة نسائية</option>
              <option value="أحذية وإكسسوارات">أحذية وإكسسوارات</option>
              <option value="تنزيلات وعروض">تنزيلات وعروض</option>
            </select>
          </div>

          <div class="form-group">
            <label for="whatsappPhone">رقم واتساب المحل (اختياري)</label>
            <input type="text" id="whatsappPhone" placeholder="مثال: 9639XXXXXXXX" />
          </div>
        </div>

        <div class="form-grid">
          <div class="form-group">
            <label for="oldPrice">السعر القديم (اختياري)</label>
            <input type="number" id="oldPrice" placeholder="اختياري" min="0" />
          </div>

          <div class="form-group">
            <label for="currentPrice">السعر الحالي (مطلوب)</label>
            <input type="number" id="currentPrice" placeholder="مطلوب" min="0" required />
          </div>
        </div>

        <div class="form-group checkbox-row">
          <input type="checkbox" id="isDiscounted" />
          <label for="isDiscounted" style="margin: 0; cursor: pointer;">إضافة شارة "تخفيضات" على هذه القطعة</label>
        </div>

        <div class="form-group">
          <label for="productImages">صور القطعة (عدد مفتوح — يمكنك الإضافة على دفعات)</label>
          <div class="upload-box">
            <input type="file" id="productImages" accept="image/*" multiple />
            <div class="upload-hint" id="imagesCountLabel">لم يتم اختيار صور بعد — يمكنك إضافة أي عدد من الصور.</div>
            <div class="preview-grid" id="imagesPreview"></div>
          </div>
        </div>

        <div class="form-group">
          <label for="productDetails">التفاصيل (العنوان / المقاسات)</label>
          <textarea id="productDetails" rows="3" placeholder="متوفر مقاسات M/L..."></textarea>
        </div>

        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
          <button type="submit" class="btn btn-primary">نشر العرض في السوق</button>
          <button type="button" class="btn btn-outline" id="clearImagesBtn">مسح الصور المختارة</button>
        </div>
      </form>
    </section>

    <!-- شريط البحث والفلترة -->
    <div class="filters-bar">
      <input type="text" id="searchInput" placeholder="ابحث عن قطعة، متجر، أو عرض ألبسة..." />
      <select id="categoryFilter">
        <option value="الكل">كل الأقسام</option>
        <option value="ألبسة رجالية">ألبسة رجالية</option>
        <option value="ألبسة نسائية">ألبسة نسائية</option>
        <option value="أحذية وإكسسوارات">أحذية وإكسسوارات</option>
        <option value="تنزيلات وعروض">تنزيلات وعروض</option>
      </select>
    </div>

    <!-- عرض المنتجات -->
    <div class="products-grid" id="productsGrid"></div>
    <div class="empty-state hidden" id="emptyState">لا توجد عروض ألبسة مضافة حالياً.</div>
  </main>

  <script>
    const STORAGE_KEY = 'tanzilat_tartus_products_v2';
    const THEME_KEY = 'tanzilat_tartus_theme_v1';

    let products = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    let draftImages = [];
    const cardImageIndices = {};

    const merchantPanel = document.getElementById('merchantPanel');
    const toggleMerchantBtn = document.getElementById('toggleMerchantBtn');
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const productForm = document.getElementById('productForm');
    const productImagesInput = document.getElementById('productImages');
    const imagesPreview = document.getElementById('imagesPreview');
    const imagesCountLabel = document.getElementById('imagesCountLabel');
    const clearImagesBtn = document.getElementById('clearImagesBtn');
    const productsGrid = document.getElementById('productsGrid');
    const emptyState = document.getElementById('emptyState');
    const searchInput = document.getElementById('searchInput');
    const categoryFilter = document.getElementById('categoryFilter');

    const isDiscountedCheckbox = document.getElementById('isDiscounted');
    const oldPriceInput = document.getElementById('oldPrice');
    const currentPriceInput = document.getElementById('currentPrice');

    if (localStorage.getItem(THEME_KEY) === 'light') {
      document.body.classList.add('light-mode');
    }

    themeToggleBtn.addEventListener('click', () => {
      document.body.classList.toggle('light-mode');
      localStorage.setItem(
        THEME_KEY,
        document.body.classList.contains('light-mode') ? 'light' : 'dark'
      );
    });

    toggleMerchantBtn.addEventListener('click', () => {
      merchantPanel.classList.toggle('hidden');
    });

    const syncDiscountAuto = () => {
      const oldVal = parseFloat(oldPriceInput.value);
      const currVal = parseFloat(currentPriceInput.value);
      if (!isNaN(oldVal) && !isNaN(currVal) && oldVal > currVal) {
        isDiscountedCheckbox.checked = true;
      }
    };
    oldPriceInput.addEventListener('input', syncDiscountAuto);
    currentPriceInput.addEventListener('input', syncDiscountAuto);

    function compressImageFile(file, maxWidth = 900, quality = 0.72) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            const scale = Math.min(1, maxWidth / img.width);
            const canvas = document.createElement('canvas');
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = reject;
          img.src = ev.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    productImagesInput.addEventListener('change', async (e) => {
      const files = Array.from(e.target.files || []).filter((f) => f.type.startsWith('image/'));
      if (!files.length) return;

      for (const file of files) {
        try {
          const compressed = await compressImageFile(file);
          draftImages.push(compressed);
        } catch (err) {
          console.error('خطأ في قراءة صورة:', file.name, err);
        }
      }

      productImagesInput.value = '';
      renderDraftImages();
    });

    function renderDraftImages() {
      imagesPreview.innerHTML = '';
      imagesCountLabel.textContent =
        draftImages.length === 0
          ? 'لم يتم اختيار صور بعد — يمكنك إضافة أي عدد من الصور.'
          : `عدد الصور المضافة لهذه القطعة: ${draftImages.length}`;

      draftImages.forEach((src, index) => {
        const item = document.createElement('div');
        item.className = 'preview-item';

        const img = document.createElement('img');
        img.src = src;
        img.alt = `صورة ${index + 1}`;

        const badge = document.createElement('span');
        badge.className = 'img-badge';
        badge.textContent = `#${index + 1}`;

        const delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.className = 'remove-img-btn';
        delBtn.textContent = '×';
        delBtn.title = 'حذف الصورة';
        delBtn.addEventListener('click', () => {
          draftImages.splice(index, 1);
          renderDraftImages();
        });

        item.appendChild(img);
        item.appendChild(badge);
        item.appendChild(delBtn);
        imagesPreview.appendChild(item);
      });
    }

    clearImagesBtn.addEventListener('click', () => {
      draftImages = [];
      renderDraftImages();
    });

    function saveProducts() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(products));
        return true;
      } catch (err) {
        alert('مساحة التخزين المحلية ممتلئة بسبب كثرة الصور. احذف بعض العروض أو قلل عدد الصور.');
        return false;
      }
    }

    productForm.addEventListener('submit', (e) => {
      e.preventDefault();

      if (draftImages.length === 0) {
        alert('يرجى إضافة صورة واحدة على الأقل للقطعة.');
        return;
      }

      const oldVal = parseFloat(oldPriceInput.value);
      const currVal = parseFloat(currentPriceInput.value);
      const autoSale = !isNaN(oldVal) && !isNaN(currVal) && oldVal > currVal;

      const newProduct = {
        id: Date.now().toString(),
        storeName: document.getElementById('storeName').value.trim(),
        title: document.getElementById('productTitle').value.trim(),
        category: document.getElementById('categorySelect').value,
        phone: document.getElementById('whatsappPhone').value.trim().replace(/\D/g, ''),
        oldPrice: oldPriceInput.value.trim(),
        currentPrice: currentPriceInput.value.trim(),
        details: document.getElementById('productDetails').value.trim(),
        isSale: Boolean(isDiscountedCheckbox.checked || autoSale),
        images: [...draftImages]
      };

      products.unshift(newProduct);
      if (!saveProducts()) {
        products.shift();
        return;
      }

      draftImages = [];
      renderDraftImages();
      productForm.reset();
      isDiscountedCheckbox.checked = false;
      renderProducts();
      alert('تم نشر العرض بنجاح!');
    });

    function deleteProduct(id) {
      products = products.filter((p) => p.id !== id);
      saveProducts();
      renderProducts();
    }

    function changeCardSlide(productId, delta, totalImages) {
      const current = cardImageIndices[productId] || 0;
      cardImageIndices[productId] = (current + delta + totalImages) % totalImages;
      renderProducts();
    }

    function renderProducts() {
      const query = searchInput.value.trim().toLowerCase();
      const selectedCat = categoryFilter.value;

      const filtered = products.filter((p) => {
        const matchesCat = selectedCat === 'الكل' || p.category === selectedCat;
        const matchesText =
          !query ||
          p.title.toLowerCase().includes(query) ||
          p.storeName.toLowerCase().includes(query) ||
          (p.details && p.details.toLowerCase().includes(query));
        return matchesCat && matchesText;
      });

      productsGrid.innerHTML = '';
      emptyState.classList.toggle('hidden', filtered.length > 0);

      filtered.forEach((p) => {
        const imgs = Array.isArray(p.images) && p.images.length ? p.images : (p.image ? [p.image] : []);
