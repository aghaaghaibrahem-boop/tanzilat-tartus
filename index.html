<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تنزيلات طرطوس - ألبسة ومشتقاتها</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        
        :root {
            --bg-main: #121212;
            --bg-card: #1a1a1a;
            --bg-input: #09090b;
            --border-color: #27272a;
            --text-main: #f4f4f5;
            --text-muted: #9ca3af;
        }

        body.light-mode {
            --bg-main: #f4f4f5;
            --bg-card: #ffffff;
            --bg-input: #f8fafc;
            --border-color: #d4d4d8;
            --text-main: #18181b;
            --text-muted: #52525b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; transition: background-color 0.25s, color 0.25s; }
        
        header { background-color: var(--bg-card); border-bottom: 1px solid var(--border-color); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 50; }
        .logo { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 1.15rem; font-weight: bold; color: #d97706; }
        .header-actions { display: flex; align-items: center; gap: 8px; }
        .theme-btn { background-color: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-main); padding: 7px 10px; border-radius: 10px; font-size: 0.95rem; cursor: pointer; }
        .merchant-btn { background-color: #d97706; color: #09090b; border: none; padding: 8px 14px; border-radius: 10px; font-weight: bold; font-size: 0.85rem; cursor: pointer; }
        
        main { flex: 1; max-width: 900px; width: 100%; margin: 0 auto; padding: 16px; }
        .search-box { width: 100%; background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 12px 16px; color: var(--text-main); font-size: 0.95rem; outline: none; margin-bottom: 12px; }
        .categories { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 16px; scrollbar-width: none; }
        .pill { background-color: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-muted); padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; white-space: nowrap; cursor: pointer; }
        .pill.active { background-color: #d97706; color: #fff; border-color: #d97706; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
        .card { background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; }
        .card img { width: 100%; height: 180px; object-fit: cover; background: #000; }
        .card-body { padding: 14px; }
        .badge { display: inline-block; background: rgba(217,119,6,0.15); color: #d97706; font-size: 0.7rem; font-weight: bold; padding: 3px 8px; border-radius: 6px; margin-bottom: 6px; }
        .card-title { font-size: 1rem; font-weight: bold; color: var(--text-main); margin-bottom: 4px; }
        .card-desc { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 10px; }
        .card-footer { padding: 12px 14px; border-top: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 8px; }
        .price { font-size: 1.1rem; font-weight: 900; color: #d97706; }
        .whatsapp-btn { background-color: #059669; color: #fff; text-align: center; padding: 8px; border-radius: 8px; font-size: 0.8rem; font-weight: bold; text-decoration: none; display: block; }
        
        /* Modals */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; align-items: center; justify-content: center; padding: 16px; }
        .modal.show { display: flex; }
        .modal-content { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; width: 100%; max-width: 450px; padding: 20px; max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; }
        .modal-header h3 { color: #d97706; font-size: 1.1rem; }
        .close-btn { background: none; border: none; color: var(--text-muted); font-size: 1.2rem; cursor: pointer; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px; }
        .form-control { width: 100%; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: 8px; padding: 8px 12px; color: var(--text-main); font-size: 0.85rem; outline: none; }
        .submit-btn { width: 100%; background: #d97706; color: #09090b; border: none; padding: 10px; border-radius: 8px; font-weight: bold; font-size: 0.9rem; cursor: pointer; margin-top: 8px; }
        .danger-btn { background: #ef4444; color: #fff; border: none; padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; }
        .lock-box { background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.4); color: #ef4444; padding: 12px; border-radius: 10px; font-size: 0.8rem; font-weight: bold; margin-bottom: 10px; display: none; }
        footer { text-align: center; padding: 16px; font-size: 0.75rem; color: var(--text-muted); border-top: 1px solid var(--border-color); margin-top: auto; }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="resetFilters()">
            <span>👔</span>
            <h1>تنزيلات طرطوس</h1>
        </div>
        <div class="header-actions">
            <button type="button" class="theme-btn" id="themeBtn" onclick="toggleTheme()">☀️</button>
            <button type="button" class="merchant-btn" onclick="openPinModal()">🔒 بوابة التجار</button>
        </div>
    </header>

    <main>
        <input type="text" id="searchInput" class="search-box" oninput="renderDeals()" placeholder="ابحث عن قطعة، متجر، أو عرض ألبسة...">
        
        <div class="categories" id="categoryPills">
            <button type="button" class="pill active" onclick="filterCat('الكل', this)">الكل</button>
            <button type="button" class="pill" onclick="filterCat('ألبسة رجالية', this)">👔 ألبسة رجالية</button>
            <button type="button" class="pill" onclick="filterCat('ألبسة نسائية', this)">👗 ألبسة نسائية</button>
            <button type="button" class="pill" onclick="filterCat('ألبسة أطفال', this)">🧒 ألبسة أطفال</button>
            <button type="button" class="pill" onclick="filterCat('أحذية وحقائب', this)">👞 أحذية وحقائب</button>
            <button type="button" class="pill" onclick="filterCat('ألبسة رياضية', this)">⚽ ألبسة رياضية</button>
        </div>

        <div class="grid" id="dealsContainer"></div>
    </main>

    <!-- PIN Modal -->
    <div class="modal" id="pinModal">
        <div class="modal-content" style="max-width: 330px; text-align: center;">
            <div style="font-size: 1.8rem; margin-bottom: 4px;">🛡️</div>
            <h3 style="margin-bottom: 4px; color: #d97706;">بوابة التجار المعتمدة</h3>
            <p style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 12px;">مخصصة لأصحاب المحلات المسجلين فقط</p>
            
            <div id="lockBox" class="lock-box">
                تم قفل الدخول مؤقتاً بسبب محاولات خاطئة. حاول بعد <span id="lockTimer">5:00</span>
            </div>

            <div id="pinArea">
                <input type="password" id="pinInput" class="form-control" placeholder="أدخل مفتاح التاجر الخاص" style="text-align: center; font-size: 1rem; letter-spacing: 3px; margin-bottom: 8px;">
                <p id="errMsg" style="font-size: 0.72rem; color: #ef4444; margin-bottom: 8px; display: none;"></p>
                <div style="display: flex; gap: 8px;">
                    <button type="button" class="submit-btn" style="margin-top:0;" onclick="verifyPin()">تحقق ودخول</button>
                    <button type="button" class="submit-btn" style="margin-top:0; background:#3f3f46; color:#fff;" onclick="closeModals()">إلغاء</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Dashboard Modal -->
    <div class="modal" id="dashboardModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="dashTitle">لوحة التحكم</h3>
                <button type="button" class="close-btn" onclick="closeModals()">✕</button>
            </div>

            <!-- Admin Add Merchant Section -->
            <div id="adminSection" style="display:none; background:var(--bg-input); padding:12px; border-radius:10px; border:1px solid rgba(217,119,6,0.4); margin-bottom:14px;">
                <h4 style="font-size:0.8rem; color:#d97706; margin-bottom:8px;">👑 إدارة المنصة: اعتماد محل ومفتاح جديد</h4>
                <form onsubmit="addMerchant(event)">
                    <div class="form-group"><input type="text" id="mName" class="form-control" placeholder="اسم المحل الجديد" required></div>
                    <div style="display:flex; gap:6px;">
                        <input type="text" id="mPin" class="form-control" placeholder="مفتاح قوي (5 خانات+)" required>
                        <input type="text" id="mWa" class="form-control" placeholder="واتساب 9639..." required>
                    </div>
                    <button type="submit" class="submit-btn" style="padding:7px; font-size:0.8rem;">اعتماد التاجر</button>
                </form>
                <div id="adminList" style="margin-top:10px; font-size:0.75rem; max-height:90px; overflow-y:auto;"></div>
            </div>

            <!-- Add Deal Form -->
            <form onsubmit="saveDeal(event)">
                <div class="form-group">
                    <label>المحل</label>
                    <input type="text" id="storeField" class="form-control" readonly style="color:#d97706; font-weight:bold;">
                </div>
                <div class="form-group">
                    <label>اسم القطعة أو العرض</label>
                    <input type="text" id="dealTitle" class="form-control" placeholder="مثال: جاكيت شتوي فاخر" required>
                </div>
                <div class="form-group">
                    <label>القسم</label>
                    <select id="dealCat" class="form-control">
                        <option value="ألبسة رجالية">ألبسة رجالية</option>
                        <option value="ألبسة نسائية">ألبسة نسائية</option>
                        <option value="ألبسة أطفال">ألبسة أطفال</option>
                        <option value="أحذية وحقائب">أحذية وحقائب</option>
                        <option value="ألبسة رياضية">ألبسة رياضية</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>صورة القطعة</label>
                    <input type="file" id="dealImg" accept="image/*" class="form-control" style="padding:4px;">
                </div>
                <div style="display:flex; gap:8px;">
                    <div class="form-group" style="flex:1;"><label>السعر القديم</label><input type="text" id="oldP" class="form-control" placeholder="اختياري"></div>
                    <div class="form-group" style="flex:1;"><label>السعر الحالي</label><input type="text" id="newP" class="form-control" placeholder="مطلوب" required></div>
                </div>
                <div class="form-group">
                    <label>التفاصيل (العنوان / المقاسات)</label>
                    <textarea id="dealDesc" class="form-control" rows="2" placeholder="متوفر مقاسات M/L..."></textarea>
                </div>
                <button type="submit" class="submit-btn">نشر العرض في السوق</button>
            </form>

            <div style="margin-top: 16px; border-top: 1px solid var(--border-color); padding-top: 10px;">
                <h4 style="font-size:0.8rem; margin-bottom:6px;">عروض محلك الحالية</h4>
                <div id="merchantDeals" style="max-height:120px; overflow-y:auto; display:flex; flex-direction:column; gap:6px;"></div>
            </div>
        </div>
    </div>

    <footer>جميع الحقوق محفوظة © تنزيلات طرطوس للألبسة 2026</footer>

    <script>
        const ADMIN_KEY = "AGHA2026";
        let merchants = JSON.parse(localStorage.getItem('trz_merchants_v2')) || [
            { store: "Agha", pin: "AGHA#11", whatsapp: "963912345678" },
            { store: "الإدارة العامة (أغآ)", pin: ADMIN_KEY, whatsapp: "963900000000" }
        ];
        let deals = JSON.parse(localStorage.getItem('trz_deals')) || [];
        let currentCat = 'الكل';
        let activeMerchant = null;

        let attempts = parseInt(localStorage.getItem('trz_attempts')) || 0;
        let lockUntil = parseInt(localStorage.getItem('trz_lock')) || 0;
        let timerInterval = null;

        // Day / Night Theme
        function initTheme() {
            const saved = localStorage.getItem('trz_theme') || 'dark';
            if (saved === 'light') {
                document.body.classList.add('light-mode');
                document.getElementById('themeBtn').textContent = '🌙';
            }
        }

        function toggleTheme() {
            const isLight = document.body.classList.toggle('light-mode');
            localStorage.setItem('trz_theme', isLight ? 'light' : 'dark');
            document.getElementById('themeBtn').textContent = isLight ? '🌙' : '☀️';
        }

        // Security Lockout
        function checkLock() {
            const now = Date.now();
            const lockBox = document.getElementById('lockBox');
            const pinArea = document.getElementById('pinArea');

            if (lockUntil > now) {
                lockBox.style.display = 'block';
                pinArea.style.display = 'none';
                updateTimer();
                if (!timerInterval) timerInterval = setInterval(updateTimer, 1000);
                return true;
            } else {
                lockBox.style.display = 'none';
                pinArea.style.display = 'block';
                if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
                if (lockUntil !== 0) {
                    lockUntil = 0; attempts = 0;
                    localStorage.removeItem('trz_lock');
                    localStorage.removeItem('trz_attempts');
                }
                return false;
            }
        }

        function updateTimer() {
            const diff = Math.max(0, lockUntil - Date.now());
            if (diff <= 0) { checkLock(); return; }
            const m = Math.floor(diff / 60000);
            const s = Math.floor((diff % 60000) / 1000);
            document.getElementById('lockTimer').textContent = `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function renderDeals() {
            const container = document.getElementById('dealsContainer');
            const search = document.getElementById('searchInput').value.toLowerCase();
            
            const filtered = deals.filter(d => {
                const matchCat = currentCat === 'الكل' || d.cat === currentCat;
                const matchSearch = d.store.toLowerCase().includes(search) || d.title.toLowerCase().includes(search) || (d.desc && d.desc.toLowerCase().includes(search));
                return matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding: 40px; color:var(--text-muted);">لا توجد عروض ألبسة مضافة حالياً.</div>`;
                return;
            }

            container.innerHTML = filtered.map((d) => `
                <div class="card">
                    <div>
                        ${d.img ? `<img src="${d.img}">` : ''}
                        <div class="card-body">
                            <span class="badge">${d.cat}</span>
                            <div style="font-size:0.75rem; color:var(--text-muted); margin-bottom:2px;">🏪 ${d.store}</div>
                            <div class="card-title">${d.title}</div>
                            ${d.desc ? `<div class="card-desc">${d.desc}</div>` : ''}
                        </div>
                    </div>
                    <div class="card-footer">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <span class="price">${d.newP}</span>
                            ${d.oldP ? `<span style="text-decoration:line-through; font-size:0.75rem; color:var(--text-muted);">${d.oldP}</span>` : ''}
                        </div>
                        ${d.whatsapp ? `<a href="https://wa.me/${d.whatsapp}?text=مرحباً، أود الاستفسار عن عرض (${d.title}) من متجر ${d.store}" target="_blank" class="whatsapp-btn">💬 تواصل عبر الواتساب</a>` : ''}
                    </div>
                </div>
            `).join('');
        }

        function filterCat(cat, btn) {
            currentCat = cat;
            document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
            btn.classList.add('active');
            renderDeals();
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.querySelectorAll('.pill')[0].click();
        }

        function openPinModal() {
            document.getElementById('pinInput').value = '';
            document.getElementById('errMsg').style.display = 'none';
            document.getElementById('pinModal').classList.add('show');
            checkLock();
        }

        function closeModals() {
            document.querySelectorAll('.modal').forEach(m => m.classList.remove('show'));
        }

        function verifyPin() {
            if (checkLock()) return;
            const pin = document.getElementById('pinInput').value.trim();
            const merchant = merchants.find(m => m.pin === pin);
            
            if (merchant) {
                attempts = 0;
                localStorage.removeItem('trz_attempts');
                activeMerchant = merchant;
                closeModals();
                document.getElementById('storeField').value = merchant.store;
                document.getElementById('dashTitle').textContent = `لوحة تحكم: ${merchant.store}`;
                
                const adminSec = document.getElementById('adminSection');
                if (merchant.pin === ADMIN_KEY) {
                    adminSec.style.display = 'block';
                    renderAdminList();
                } else {
                    adminSec.style.display = 'none';
                }

                document.getElementById('dashboardModal').classList.add('show');
                renderMerchantDeals();
            } else {
                attempts++;
                localStorage.setItem('trz_attempts', attempts);
                const err = document.getElementById('errMsg');
                if (attempts >= 3) {
                    lockUntil = Date.now() + (5 * 60 * 1000);
                    localStorage.setItem('trz_lock', lockUntil);
                    checkLock();
                } else {
                    err.textContent = `مفتاح خاطئ! متبقي ${3 - attempts} محاولات قبل القفل المؤقت.`;
                    err.style.display = 'block';
                }
            }
        }

        function renderAdminList() {
            document.getElementById('adminList').innerHTML = merchants.map((m, i) => `
                <div style="display:flex; justify-content:space-between; align-items:center; background:var(--bg-card); border:1px solid var(--border-color); padding:5px 8px; margin-bottom:4px; border-radius:6px;">
                    <span><b>${m.store}</b> (المفتاح: <span style="color:#d97706;">${m.pin}</span>)</span>
                    ${m.pin !== ADMIN_KEY ? `<button type="button" class="danger-btn" onclick="delMerchant(${i})">حذف</button>` : ''}
                </div>
            `).join('');
        }

        function addMerchant(e) {
            e.preventDefault();
            const store = document.getElementById('mName').value.trim();
            const pin = document.getElementById('mPin').value.trim();
            const whatsapp = document.getElementById('mWa').value.trim();
            
            if (pin.length < 5) {
                alert('يجب أن يكون المفتاح السري 5 خانات على الأقل لضمان الأمان!');
                return;
            }
            if (merchants.some(m => m.pin === pin)) {
                alert('هذا المفتاح مستخدم مسبقاً!');
                return;
            }
            merchants.push({ store, pin, whatsapp });
            localStorage.setItem('trz_merchants_v2', JSON.stringify(merchants));
            document.getElementById('mName').value = '';
            document.getElementById('mPin').value = '';
            document.getElementById('mWa').value = '';
            renderAdminList();
            alert('تم اعتماد المحل ومفتاحه السري بنجاح!');
        }

        function delMerchant(i) {
            if (confirm('هل أنت متأكد من إلغاء اعتماد هذا المحل؟')) {
                merchants.splice(i, 1);
                localStorage.setItem('trz_merchants_v2', JSON.stringify(merchants));
                renderAdminList();
            }
        }

        function saveDeal(e) {
            e.preventDefault();
            const fileInput = document.getElementById('dealImg');
            
            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(ev) {
                    pushDeal(ev.target.result);
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                pushDeal(null);
            }
        }

        function pushDeal(imgUrl) {
            const newDeal = {
                store: activeMerchant.store,
                whatsapp: activeMerchant.whatsapp,
                title: document.getElementById('dealTitle').value,
                cat: document.getElementById('dealCat').value,
                oldP: document.getElementById('oldP').value,
                newP: document.getElementById('newP').value,
                desc: document.getElementById('dealDesc').value,
                img: imgUrl
            };

            deals.unshift(newDeal);
            localStorage.setItem('trz_deals', JSON.stringify(deals));
            
            document.getElementById('dealTitle').value = '';
            document.getElementById('oldP').value = '';
            document.getElementById('newP').value = '';
            document.getElementById('dealDesc').value = '';
            document.getElementById('dealImg').value = '';

            renderDeals();
            renderMerchantDeals();
            alert('تم نشر العرض بنجاح!');
        }

        function renderMerchantDeals() {
            const list = document.getElementById('merchantDeals');
            const myDeals = deals.filter(d => activeMerchant.pin === ADMIN_KEY || d.store === activeMerchant.store);
            
            if (myDeals.length === 0) {
                list.innerHTML = `<span style="font-size:0.75rem; color:var(--text-muted); text-align:center;">لا توجد عروض مضافة بعد.</span>`;
                return;
            }

            list.innerHTML = myDeals.map((d) => {
                const idx = deals.indexOf(d);
                return `
                    <div style="display:flex; justify-content:space-between; align-items:center; background:var(--bg-input); border:1px solid var(--border-color); padding:6px 10px; border-radius:6px; font-size:0.75rem;">
                        <span><b>${d.store}:</b> ${d.title}</span>
                        <button type="button" class="danger-btn" onclick="delDeal(${idx})">حذف</button>
                    </div>
                `;
            }).join('');
        }

        function delDeal(idx) {
            if (confirm('هل تريد حذف هذا العرض؟')) {
                deals.splice(idx, 1);
                localStorage.setItem('trz_deals', JSON.stringify(deals));
                renderDeals();
                renderMerchantDeals();
            }
        }

        initTheme();
        renderDeals();
    </script>
</body>
</html>
