<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تنزيلات طرطوس - منصة عروض التجار</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">
    <header class="bg-slate-800 border-b border-slate-700 p-4 shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-black text-amber-400">🏷️ تنزيلات طرطوس</h1>
            <button onclick="openMerchantModal()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-4 py-2 rounded-xl text-sm transition shadow-lg">لوحة التاجر 🔐</button>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 w-full flex-grow">
        <div class="mb-6">
            <input type="text" id="searchInput" oninput="filterDeals()" placeholder="ابحث عن منتج، متجر، أو تخفيض..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-amber-500 transition">
        </div>
        <div id="dealsContainer" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <p class="text-center text-slate-400 col-span-full py-10">جاري تحميل أحدث العروض في طرطوس...</p>
        </div>
    </main>

    <!-- Modal for Merchant -->
    <div id="merchantModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-md rounded-2xl p-6 shadow-2xl relative">
            <button onclick="closeMerchantModal()" class="absolute top-4 left-4 text-slate-400 hover:text-white font-bold">✕</button>
            <div id="authView">
                <h2 class="text-lg font-bold mb-4 text-amber-400">تسجيل دخول التاجر</h2>
                <p class="text-xs text-slate-400 mb-4">أدخل الرمز السري الخاص بمتجرك لإدارة العروض.</p>
                <input type="password" id="pinInput" placeholder="الرمز السري (PIN)" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 mb-4 text-sm focus:outline-none focus:border-amber-500">
                <button onclick="verifyPin()" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 rounded-xl transition">دخول</button>
            </div>
            <div id="dashboardView" class="hidden">
                <h2 class="text-lg font-bold mb-4 text-amber-400">إضافة عرض جديد</h2>
                <input type="text" id="itemStore" placeholder="اسم المحل (مثال: محلات النور - شارع الثورة)" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 mb-3 text-sm">
                <input type="text" id="itemTitle" placeholder="اسم المنتج والعرض (مثال: بنطال جينز بخصم 30%)" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 mb-3 text-sm">
                <input type="text" id="itemPrice" placeholder="السعر بعد التخفيض (مثال: 75 ألف ليرة)" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 mb-3 text-sm">
                <button onclick="publishDeal()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-3 rounded-xl transition mb-2">نشر العرض فوراً</button>
                <button onclick="logoutMerchant()" class="w-full bg-rose-500/20 hover:bg-rose-500/30 text-rose-400 font-bold py-2 rounded-xl text-xs transition">خروج</button>
            </div>
        </div>
    </div>

    <footer class="bg-slate-800 border-t border-slate-700 p-4 text-center text-xs text-slate-400">
        منصة تنزيلات طرطوس الحية © 2026 - صُممت لأجل أهل طرطوس الأحباء ❤️
    </footer>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDummyKeyForTartusPlatform",
            authDomain: "tanzilat-tartus.firebaseapp.com",
            projectId: "tanzilat-tartus",
            storageBucket: "tanzilat-tartus.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window.db = db;
        window.collection = collection;
        window.addDoc = addDoc;
        window.getDocs = getDocs;
        window.query = query;
        window.orderBy = orderBy;

        loadDeals();
    </script>

    <script>
        let allDeals = [];

        function openMerchantModal() {
            document.getElementById('merchantModal').classList.remove('hidden');
        }

        function closeMerchantModal() {
            document.getElementById('merchantModal').classList.add('hidden');
        }

        function verifyPin() {
            const pin = document.getElementById('pinInput').value;
            if (pin === "2026" || pin === "1234" || pin.length >= 3) {
                document.getElementById('authView').classList.add('hidden');
                document.getElementById('dashboardView').classList.remove('hidden');
            } else {
                alert('الرمز السري غير صحيح!');
            }
        }

        function logoutMerchant() {
            document.getElementById('dashboardView').classList.add('hidden');
            document.getElementById('authView').classList.remove('hidden');
            document.getElementById('pinInput').value = '';
        }

        async function publishDeal() {
            const store = document.getElementById('itemStore').value;
            const title = document.getElementById('itemTitle').value;
            const price = document.getElementById('itemPrice').value;

            if (!store || !title || !price) {
                alert('الرجاء تعبئة كافة الحقول!');
                return;
            }

            try {
                await window.addDoc(window.collection(window.db, "deals"), {
                    store: store,
                    title: title,
                    price: price,
                    createdAt: new Date()
                });
                alert('تم نشر العرض بنجاح في طرطوس!');
                document.getElementById('itemStore').value = '';
                document.getElementById('itemTitle').value = '';
                document.getElementById('itemPrice').value = '';
                closeMerchantModal();
                loadDeals();
            } catch (e) {
                console.error(e);
                alert('حدث خطأ أثناء النشر، تأكد من اتصال الإنترنت.');
            }
        }

        async function loadDeals() {
            const container = document.getElementById('dealsContainer');
            try {
                const q = window.query(window.collection(window.db, "deals"), window.orderBy("createdAt", "desc"));
                const querySnapshot = await window.getDocs(q);
                allDeals = [];
                querySnapshot.forEach((doc) => {
                    allDeals.push(doc.data());
                });

                renderDeals(allDeals);
            } catch (e) {
                console.error(e);
                container.innerHTML = `<p class="text-center text-rose-400 col-span-full py-10">عذراً، جاري ربط قاعدة البيانات... تأكد من إنشاء مجموعة deals في فايرستور.</p>`;
            }
        }

        function renderDeals(deals) {
            const container = document.getElementById('dealsContainer');
            if (deals.length === 0) {
                container.innerHTML = `<p class="text-center text-slate-400 col-span-full py-10">لا توجد عروض مضافة حالياً. كن أول تاجر يضيف عرضاً!</p>`;
                return;
            }
            container.innerHTML = deals.map(deal => `
                <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 shadow-md flex flex-col justify-between">
                    <div>
                        <span class="bg-amber-500/10 text-amber-400 text-xs font-bold px-2.5 py-1 rounded-lg">${deal.store}</span>
                        <h3 class="font-bold text-base mt-2 text-white">${deal.title}</h3>
                    </div>
                    <div class="mt-4 flex justify-between items-center border-t border-slate-700/60 pt-3">
                        <span class="text-emerald-400 font-black text-sm">${deal.price}</span>
                        <span class="text-xs text-slate-500">منطقة طرطوس</span>
                    </div>
                </div>
            `).join('');
        }

        function filterDeals() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allDeals.filter(d => d.store.toLowerCase().includes(term) || d.title.toLowerCase().includes(term));
            renderDeals(filtered);
        }
    </script>
</body>
</html>
