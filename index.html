<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تنزيلات طرطوس - ألبسة ومشتقاتها</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');

    :root {
      --bg-main: #121212;
      --bg-card: #1a1a1a;
      --bg-input: #09090b;
      --border-color: #27272a;
      --text-main: #f4f4f5;
      --text-muted: #9ca3af;
      --accent: #d97706;
      --accent-orange: #ea580c;
      --accent-hover: #b45309;
      --sale-badge: #991b1b;
      --success: #16a34a;
      --danger: #dc2626;
    }

    body.light-mode {
      --bg-main: #f8fafc;
      --bg-card: #ffffff;
      --bg-input: #ffffff;
      --border-color: #e2e8f0;
      --text-main: #1e293b;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      font-family: 'Cairo', sans-serif;
    }

    body {
      margin: 0;
      background-color: var(--bg-main);
      color: var(--text-main);
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    /* الهيدر العلوي كما في الصورة */
    header {
      background-color: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      padding: 16px;
    }

    .header-inner {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .merchant-btn {
      background: linear-gradient(135deg, #ea580c, #d97706);
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 10px 14px;
      font-weight: 800;
      font-size: 0.9rem;
      line-height: 1.25;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(217, 119, 6, 0.22);
    }

    .theme-btn {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: #f59e0b;
      font-size: 1.3rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .brand-title {
      text-align: right;
      line-height: 1.15;
    }

    .brand-title .line-1 {
      display: block;
      font-size: 1.65rem;
      font-weight: 800;
      color: var(--accent);
    }

    .brand-title .line-2 {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 1.65rem;
      font-weight: 800;
      color: var(--accent);
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 14px 16px 32px;
    }

    /* حقل البحث */
    .search-box input {
      width: 100%;
      padding: 13px 16px;
      border-radius: 14px;
      border: 1px solid var(--border-color);
      background: var(--bg-input);
      color: var(--text-main);
      font-size: 0.98rem;
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--accent);
    }

    /* شريط الأقسام الأفقية المطابق للصورة */
    .categories-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow-x: auto;
      padding: 14px 2px 8px;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .categories-bar::-webkit-scrollbar {
      display: none;
    }

    .cat-pill {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 9px 18px;
      border-radius: 999px;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-main);
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .cat-pill.active {
      background: linear-gradient(135deg, #ea580c, #d97706);
      color: #ffffff;
      border-color: transparent;
      box-shadow: 0 4px 10px rgba(217, 119, 6, 0.25);
    }

    /* لوحة التاجر */
    .panel {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 18px;
      margin-top: 16px;
    }

    .hidden {
      display: none !important;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }

    .checkbox-row {
      flex-direction: row;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
    }

    .checkbox-row input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent-orange);
      cursor: pointer;
    }

    label {
      font-weight: 700;
      font-size: 0.9rem;
    }

    input[type="text"],
    input[type="number"],
    select,
    textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: var(--bg-input);
      color: var(--text-main);
      font-size: 0.95rem;
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 9px 14px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .btn-primary {
      background: var(--accent-orange);
      color: #fff;
    }

    .btn-outline {
      background: transparent;
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }

    .btn-danger {
      background: var(--danger);
      color: #fff;
      padding: 6px 10px;
      font-size: 0.8rem;
    }

    .upload-box {
      border: 1.5px dashed var(--accent-orange);
      background: var(--bg-input);
      border-radius: 12px;
      padding: 12px;
    }

    .upload-hint {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 6px;
    }

    .preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
      gap: 10px;
      margin-top: 12px;
    }

    .preview-item {
      position: relative;
      aspect-ratio: 1 / 1;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      background: #000;
    }

    .preview-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .remove-img-btn {
      position: absolute;
      top: 4px;
      left: 4px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: none;
      background: rgba(220, 38, 38, 0.92);
      color: #fff;
      font-weight: 800;
      cursor: pointer;
      line-height: 1;
    }

    .img-badge {
      position: absolute;
      bottom: 4px;
      right: 4px;
      background: rgba(0, 0, 0, 0.72);
      color: #fff;
      font-size: 0.7rem;
      padding: 1px 6px;
      border-radius: 6px;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px 14px;
      margin-top: 18px;
    }

    @media (min-width: 768px) {
      .products-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .product-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .media-box {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1.05;
      background: var(--bg-input);
      overflow: hidden;
    }

    .media-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .sale-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(153, 27, 27, 0.92);
      color: #ffffff;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 8px;
      z-index: 2;
    }

    .photos-counter {
      position: absolute;
      bottom: 8px;
      left: 8px;
      background: rgba(0, 0, 0, 0.72);
      color: #fff;
      font-size: 0.74rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      z-index: 2;
    }

    .gallery-nav {
      position: absolute;
      inset-inline: 6px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      z-index: 2;
    }

    .gallery-nav button {
      pointer-events: auto;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: none;
      background: rgba(0, 0, 0, 0.62);
      color: #fff;
      font-weight: 800;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .product-body {
      padding: 10px 12px;
    }

    .store-tag {
      font-size: 0.76rem;
      color: var(--accent-orange);
      font-weight: 700;
    }

    .product-title {
      margin: 3px 0 4px;
      font-size: 0.92rem;
      font-weight: 800;
      line-height: 1.35;
    }

    .product-desc {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin: 0 0 8px;
      white-space: pre-line;
    }

    .price-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .current-price {
      font-weight: 800;
      color: var(--accent-orange);
      font-size: 0.9rem;
    }

    .old-price {
      font-size: 0.78rem;
      color: var(--text-muted);
      text-decoration: line-through;
    }

    .card-actions {
      display: flex;
      gap: 6px;
      padding: 0 12px 12px;
      align-items: center;
    }

    .whatsapp-btn {
      flex: 1;
      text-align: center;
      text-decoration: none;
      background: var(--success);
      color: #fff;
      padding: 7px 8px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.8rem;
    }

    .empty-state {
      text-align: center;
      padding: 54px 16px;
      color: var(--text-muted);
      font-size: 1.05rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="header-actions">
        <button type="button" class="merchant-btn" id="toggleMerchantBtn">
          🔒 بوابة<br />التجار
        </button>
        <button type="button" class="theme-btn" id="themeToggleBtn" title="تبديل الوضع">🌙</button>
      </div>

      <div class="brand-title">
        <span class="line-1">تنزيلات</span>
        <span class="line-2">طرطوس 👔</span>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- بوابة إضافة العروض -->
    <section class="panel hidden" id="merchantPanel">
      <h2 style="margin-top: 0;">إضافة عرض جديد</h2>

      <form id="productForm">
        <div class="form-grid">
          <div class="form-group">
            <label for="storeName">المحل</label>
            <input type="text" id="storeName" placeholder="مثال: محلات جيفان / باليرينا" required />
          </div>

          <div class="form-group">
            <label for="productTitle">اسم القطعة أو العرض</label>
            <input type="text" id="productTitle" placeholder="مثال: جاكيت شتوي فاخر" required />
          </div>

          <div class="form-group">
            <label for="categorySelect">القسم</label>
            <select id="categorySelect">
              <option value="ألبسة رجالية">ألبسة رجالية</option>
              <option value="ألبسة نسائية">ألبسة نسائية</option>
              <option value="ألبسة أطفال">ألبسة أطفال</option>
              <option value="أحذية وحقائب">أحذية وحقائب</option>
              <option value="إكسسوارات">إكسسوارات</option>
            </select>
          </div>

          <div class="form-group">
            <label for="whatsappPhone">رقم واتساب المحل (اختياري)</label>
            <input type="text" id="whatsappPhone" placeholder="مثال: 9639XXXXXXXX" />
          </div>
        </div>

        <div class="form-grid">
          <div class="form-group">
            <label for="oldPrice">السعر القديم (اختياري)</label>
            <input type="number" id="oldPrice" placeholder="اختياري" min="0" />
          </div>

          <div class="form-group">
            <label for="currentPrice">السعر الحالي (مطلوب)</label>
            <input type="number" id="currentPrice" placeholder="مطلوب" min="0" required />
          </div>
        </div>

        <div class="form-group checkbox-row">
          <input type="checkbox" id="isDiscounted" />
          <label for="isDiscounted" style="margin: 0; cursor: pointer;">إضافة شارة "تخفيضات" على هذه القطعة</label>
        </div>

        <div class="form-group">
          <label for="productImages">صور القطعة (عدد مفتوح — يمكنك الإضافة على دفعات)</label>
          <div class="upload-box">
            <input type="file" id="productImages" accept="image/*" multiple />
            <div class="upload-hint" id="imagesCountLabel">لم يتم اختيار صور بعد — يمكنك إضافة أي عدد من الصور.</div>
            <div class="preview-grid" id="imagesPreview"></div>
          </div>
        </div>

        <div class="form-group">
          <label for="productDetails">التفاصيل (العنوان / المقاسات)</label>
          <textarea id="productDetails" rows="3" placeholder="متوفر مقاسات M/L..."></textarea>
        </div>

        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
          <button type="submit" class="btn btn-primary">نشر العرض في السوق</button>
          <button type="button" class="btn btn-outline" id="clearImagesBtn">مسح الصور المختارة</button>
        </div>
      </form>
    </section>

    <!-- حقل البحث -->
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="ابحث عن قطعة، متجر، أو عرض ألبسة..." />
    </div>

    <!-- شريط الأقسام الأفقية كما في الصورة -->
    <div class="categories-bar" id="categoriesBar">
      <button type="button" class="cat-pill active" data-category="الكل">الكل</button>
      <button type="button" class="cat-pill" data-category="ألبسة رجالية">👔 ألبسة رجالية</button>
      <button type="button" class="cat-pill" data-category="ألبسة نسائية">👗 ألبسة نسائية</button>
      <button type="button" class="cat-pill" data-category="ألبسة أطفال">🧒 ألبسة أطفال</button>
      <button type="button" class="cat-pill" data-category="أحذية وحقائب">👟 أحذية وحقائب</button>
      <button type="button" class="cat-pill" data-category="إكسسوارات">🕶️ إكسسوارات</button>
    </div>

    <!-- عرض المنتجات -->
    <div class="products-grid" id="productsGrid"></div>
    <div class="empty-state" id="emptyState">لا توجد عروض ألبسة مضافة حالياً.</div>
  </main>

  <script>
    const STORAGE_KEY = 'tanzilat_tartus_products_v2';
    const THEME_KEY = 'tanzilat_tartus_theme_v1';

    let products = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    let draftImages = [];
    let activeCategory = 'الكل';
    const cardImageIndices = {};

    const merchantPanel = document.getElementById('merchantPanel');
    const toggleMerchantBtn = document.getElementById('toggleMerchantBtn');
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const productForm = document.getElementById('productForm');
    const productImagesInput = document.getElementById('productImages');
    const imagesPreview = document.getElementById('imagesPreview');
    const imagesCountLabel = document.getElementById('imagesCountLabel');
    const clearImagesBtn = document.getElementById('clearImagesBtn');
    const productsGrid = document.getElementById('productsGrid');
    const emptyState = document.getElementById('emptyState');
    const searchInput = document.getElementById('searchInput');
    const categoryPills = document.querySelectorAll('.cat-pill');

    const isDiscountedCheckbox = document.getElementById('isDiscounted');
    const oldPriceInput = document.getElementById('oldPrice');
    const currentPriceInput = document.getElementById('currentPrice');

    // الوضع الافتراضي فاتح كما في الصورة
    if (localStorage.getItem(THEME_KEY) === 'dark') {
      document.body.classList.remove('light-mode');
      themeToggleBtn.textContent = '☀️';
    } else {
      document.body.classList.add('light-mode');
      themeToggleBtn.textContent = '🌙';
    }

    themeToggleBtn.addEventListener('click', () => {
      document.body.classList.toggle('light-mode');
      const isLight = document.body.classList.contains('light-mode');
      localStorage.setItem(THEME_KEY, isLight ? 'light' : 'dark');
      themeToggleBtn.textContent = isLight ? '🌙' : '☀️';
    });

    toggleMerchantBtn.addEventListener('click', () => {
      merchantPanel.classList.toggle('hidden');
    });

    // تفعيل أزرار الأقسام الأفقية
    categoryPills.forEach((pill) => {
      pill.addEventListener('click', () => {
        categoryPills.forEach((p) => p.classList.remove('active'));
        pill.classList.add('active');
        activeCategory = pill.dataset.category;
        renderProducts();
      });
    });

    const syncDiscountAuto = () => {
      const oldVal = parseFloat(oldPriceInput.value);
      const currVal = parseFloat(currentPriceInput.value);
      if (!isNaN(oldVal) && !isNaN(currVal) && oldVal > currVal) {
        isDiscountedCheckbox.checked = true;
      }
    };
    oldPriceInput.addEventListener('input', syncDiscountAuto);
    currentPriceInput.addEventListener('input', syncDiscountAuto);

    function compressImageFile(file, maxWidth = 900, quality = 0.72) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            const scale = Math.min(1, maxWidth / img.width);
            const canvas = document.createElement('canvas');
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = reject;
          img.src = ev.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    productImagesInput.addEventListener('change', async (e) => {
      const files = Array.from(e.target.files || []).filter((f) => f.type.startsWith('image/'));
      if (!files.length) return;

      for (const file of files) {
        try {
          const compressed = await compressImageFile(file);
          draftImages.push(compressed);
        } catch (err) {
          console.error('خطأ في قراءة صورة:', file.name, err);
        }
      }

      productImagesInput.value = '';
      renderDraftImages();
    });

    function renderDraftImages() {
      imagesPreview.innerHTML = '';
      imagesCountLabel.textContent =
        draftImages.length === 0
          ? 'لم يتم اختيار صور بعد — يمكنك إضافة أي عدد من الصور.'
          : `عدد الصور المضافة لهذه القطعة: ${draftImages.length}`;

      draftImages.forEach((src, index) => {
        const item = document.createElement('div');
        item.className = 'preview-item';

        const img = document.createElement('img');
        img.src = src;
        img.alt = `صورة ${index + 1}`;

        const badge = document.createElement('span');
        badge.className = 'img-badge';
        badge.textContent = `#${index + 1}`;

        const delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.className = 'remove-img-btn';
        delBtn.textContent = '×';
        delBtn.title = 'حذف الصورة';
        delBtn.addEventListener('click', () => {
          draftImages.splice(index, 1);
          renderDraftImages();
        });

        item.appendChild(img);
        item.appendChild(badge);
        item.appendChild(delBtn);
        imagesPreview.appendChild(item);
      });
    }

    clearImagesBtn.addEventListener('click', () => {
      draftImages = [];
      renderDraftImages();
    });
